[project]
name = "bizak-panel"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "babel>=2.17.0",
    "bokeh>=3.7.3",
    "boto3>=1.42.55",
    "diskcache>=5.6.3",
    "google-api-python-client>=2.169.0",
    "google-auth-oauthlib>=1.2.1",
    "gspread>=6.2.1",
    "holoviews>=1.20.2",
    "ipython>=9.2.0",
    "matplotlib>=3.10.3",
    "ms-active-directory>=1.14.1",
    "my-panel-extensions",
    "nbconvert>=7.16.6",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    #"panel==1.8.10",
    "panel==1.9.4",
    #"panel-material-ui>=0.8.0",
    "panel-graphic-walker>=0.6.4",
    "panel-material-ui>=0.12.0",
    "papermill>=2.6.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.4",
    "pyodbc>=5.2.0",
    "pyyaml>=6.0.2",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.1.1",
    "squarify>=0.4.4",
    "textual>=8.1.1",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.4.3",
    "pytest>=9.1.1",
]

[tool.uv.sources]
my-panel-extensions = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]
